{{- if and .Values.nodelocal.enabled .Values.nodelocal.use_cilium_lrp }}
apiVersion: "cilium.io/v2"
kind: CiliumLocalRedirectPolicy
metadata:
  name: "lrp-nodelocal"
  namespace: {{ .Release.Namespace }}
spec:
  skipRedirectFromBackend: true
  redirectFrontend:
    serviceMatcher:
      serviceName: {{ default (include "coredns.fullname" .) .Values.service.name }}
      namespace: {{ .Release.Namespace }}
      toPorts:
        - name: {{ include "coredns.portName" (dict "protocol" "udp" "port" 53) }}
          port: "53"
          protocol: UDP
        - name: {{ include "coredns.portName" (dict "protocol" "tcp" "port" 53) }}
          port: "53"
          protocol: TCP
  redirectBackend:
    localEndpointSelector:
      matchLabels:
        k8s-app: node-local-dns
    toPorts:
      - name: {{ include "coredns.portName" (dict "protocol" "udp" "port" 53) }}
        port: "53"
        protocol: UDP
      - name: {{ include "coredns.portName" (dict "protocol" "tcp" "port" 53) }}
        port: "53"
        protocol: TCP
{{- end }}