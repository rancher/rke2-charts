---
name: "Update Traefik Chart"

sources:
  traefik_chart:
    name: Get Traefik chart version
    kind: githubrelease
    spec:
      owner: traefik
      repository: traefik-helm-chart
      token: '{{ requiredEnv .github.token }}'
      typefilter:
        release: true
        draft: false
        prerelease: false
      versionfilter:
        kind: regex
        pattern: 'v[0-9]+\.[0-9]+\.[0-9]+'
    transformers:
      - trimprefix: "v"
  traefik_image:
    name: Get Traefik image version
    kind: githubrelease
    spec:
      owner: rancher
      repository: image-build-traefik
      token: '{{ requiredEnv .github.token }}'
      username: '{{ requiredEnv .github.username }}'
      typefilter:
        release: true
        draft: false
        prerelease: false
      versionfilter:
        kind: regex
        # pattern accepts any semver constraint
        pattern: "v[0-9]+.[0-9]+.[0-9]+-build[0-9]+"

targets:
  traefik:
    name: Update Traefik chart and image
    kind: shell
    scmid: default
    sourceid: traefik_chart
    spec:
      command: 'updatecli/scripts/update-traefik.sh'
      environments:
        - name: TRAEFIK_CHART_VERSION
          value: '{{ source "traefik_chart" }}'
        - name: TRAEFIK_IMAGE_VERSION
          value: '{{ source "traefik_image" }}'
        - name: PATH

scms:
  default:
    kind: github
    spec:
      token: '{{ requiredEnv .github.token }}'
      username: '{{ requiredEnv .github.username }}'
      user: '{{ .github.username }}'
      email: '{{ .github.email }}'
      owner: '{{ .github.owner }}'
      repository: '{{ .github.repository }}'
      branch: '{{ .github.branch }}'

actions:
  default:
    title: Update Traefik chart {{ source "traefik_chart" }}
    kind: github/pullrequest
    spec:
      strategy:
        method: manual
      description:
        <h3>Chart Images</h3>
        <ul>
          <li>rancher/hardened-traefik:{{ source "traefik_image" }}</li>
        </ul>
      labels:
        - updatecli
    scmid: default