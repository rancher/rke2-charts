---
name: "Update Multus version" 

sources:
  multus:
    name: Get multus version
    kind: githubrelease
    spec:
      owner: rancher
      repository: image-build-multus
      token: '{{ requiredEnv .github.token }}'
      typefilter:
        release: true
        draft: false
        prerelease: false
      versionfilter:
        kind: regex
        # pattern accepts any semver constraint
        pattern: "v[0-9]+.[0-9]+.[0-9]+-build[0-9]+"

  cni_plugins:
    name: Get CNI plugins version
    kind: githubrelease
    spec:
      owner: rancher
      repository: image-build-cni-plugins
      token: '{{ requiredEnv .github.token }}'
      username: '{{ requiredEnv .github.username }}'
      typefilter:
        release: true
        draft: false
        prerelease: false
      versionfilter:
        kind: regex
        # pattern accepts any semver constraint
        pattern: "v[0-9]+.[0-9]+.[0-9]+-build[0-9]+"

  network_controller:
    name: Get dynamic network controller version
    kind: githubrelease
    spec:
      owner: rancher
      repository: image-build-multus-dynamic-networks-controller
      token: '{{ requiredEnv .github.token }}'
      username: '{{ requiredEnv .github.username }}'
      typefilter:
        release: true
        draft: false
        prerelease: false
      versionfilter:
        kind: regex
        # pattern accepts any semver constraint
        pattern: "v[0-9]+.[0-9]+.[0-9]+-build[0-9]+"


targets:
  multusImage:
    name: "Bump to latest multus version in the chart"
    kind: shell
    scmid: default
    sourceid: multus
    spec:
      command: 'updatecli/scripts/update-multus.sh'
      environments:
        - name: MULTUS_VERSION
          value: '{{ source "multus" }}'
        - name: CNI_PLUGINS_VERSION
          value: '{{ source "cni_plugins" }}'
        - name: NETWORK_CONTROLLER_VERSION
          value: '{{ source "network_controller" }}'
        - name: PATH
        - name: UPDATECLI_GITHUB_WORKFLOW_URL
        - name: GH_TOKEN

scms:
  default:
    kind: github
    spec:
      token: '{{ requiredEnv .github.token }}'
      username: '{{ requiredEnv .github.username }}'
      user: '{{ .github.username }}'
      email: '{{ .github.email }}'
      owner: '{{ .github.owner }}'
      repository: '{{ .github.repository }}'
      branch: '{{ .github.branch }}'
      
actions:
  default:
    title: 'Update Multus version to {{ source "multus" }}, CNI plugins to {{ source "cni_plugins" }} and dynamic network controller to {{ source "network_controller" }}'
    kind: github/pullrequest
    spec:
      strategy:
        method: manual
      labels:
        - updatecli
    scmid: default
