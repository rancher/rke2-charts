name: CI-pullrequest

on:
  pull_request:
    branches:
      - main-source

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: published
          persist-credentials: false

      - name: Validate
        run: make validate
        env:
          LIVE_DIR: ${{ github.workspace }}/published
          # CHARTS_BASE_REF: ${{ github.event.pull_request.base.sha }}
